name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: libcore/go.sum

      - name: Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1" "ndk;25.0.8775105"

      - name: Cache libcore.aar
        id: core-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('libcore/*.go', 'libcore/go.mod', 'buildScript/lib/core/get_source_env.sh') }}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: go-${{ hashFiles('libcore/go.sum', 'buildScript/lib/core/get_source_env.sh') }}

      - name: Build libcore
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.0.8775105"
          bash buildScript/lib/core/init.sh
          bash buildScript/lib/core/build.sh

      - name: Unit tests and debug build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash ./gradlew --console=plain :app:testOssDebugUnitTest :app:assembleOssDebug
