name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: libcore/go.sum

      - name: Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1" "ndk;25.0.8775105"

      - name: Cache libcore.aar
        id: core-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('libcore/*.go', 'libcore/go.mod', 'buildScript/lib/core/get_source_env.sh') }}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: go-${{ hashFiles('libcore/go.sum', 'buildScript/lib/core/get_source_env.sh') }}

      - name: Build libcore
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.0.8775105"
          bash buildScript/lib/core/init.sh
          bash buildScript/lib/core/build.sh

      - name: Resolve version
        id: meta
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref_name }}" != "v$VERSION_NAME" ]; then
              echo "Tag ${{ github.ref_name }} does not match nb4a.properties ($VERSION_NAME)" >&2
              exit 1
            fi
          fi

      - name: Signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "ALIAS_NAME=$ALIAS_NAME"
            echo "ALIAS_PASS=$ALIAS_PASS"
          } > local.properties

      - name: Build release APKs (phone + TV)
        run: |
          bash ./gradlew --console=plain \
            :app:assembleOssRelease :app:assembleOssTvRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -path '*release*' -exec cp {} dist/ \;
          cd dist
          sha256sum ./*.apk > SHA256SUMS
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "FreedomCat $TAG" \
              --generate-notes
          fi
